<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d0d;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 1s ease;
        }

        /* Background Stars & Particles */
        #bg-effects {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .petal {
            position: absolute;
            font-size: 1.5rem;
            animation: fall 10s linear infinite;
            opacity: 0.7;
        }
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        #heart-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .container {
            position: relative; z-index: 2;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        /* Page System */
        .page {
            display: none;
            animation: fadeIn 0.6s ease;
        }
        .page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #ff4d6d;
            text-shadow: 0 0 20px rgba(255, 77, 109, 0.8);
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle { font-size: 1.2rem; color: #ffb3c1; margin-bottom: 30px; }

        /* Yes/No Buttons Container */
        .yes-no-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 40px 0;
            position: relative;
            min-height: 200px; 
            width: 100%;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff4d6d, #ff8fa3);
            color: #fff;
            border: none;
            padding: 15px 45px;
            font-size: 1.2rem;
            font-family: 'Poppins', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 999; /* Yes ကို အပေါ်ဆုံးမှာ ထားမယ် */
        }
        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.8);
        }

        .btn-no {
            background: transparent;
            border: 2px solid #ff4d6d;
            color: #ff4d6d;
            padding: 15px 45px;
            font-size: 1.2rem;
            font-family: 'Poppins', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            position: relative; /* ပြေးဖို့အတွက် relative ထားမယ် */
            transition: font-size 0.2s ease, padding 0.2s ease;
            z-index: 1;
            outline: none;
        }

        /* Final Page Styles */
        .date-counter {
            display: flex; justify-content: center;
            gap: 15px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .counter-box {
            background: rgba(255, 77, 109, 0.1);
            border: 1px solid #ff4d6d;
            border-radius: 10px; padding: 15px;
            min-width: 80px; backdrop-filter: blur(5px);
        }
        .counter-box span {
            font-size: 2rem; font-weight: bold;
            color: #ff4d6d; display: block;
        }
        .counter-box p {
            font-size: 0.8rem; color: #ffb3c1;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .slideshow-container {
            position: relative;
            margin: 30px auto;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 5px solid #ff4d6d;
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.6);
            overflow: hidden;
            animation: glow 3s infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(255, 77, 109, 0.4); }
            to { box-shadow: 0 0 40px rgba(255, 77, 109, 0.9); }
        }
        .slideshow-container img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease, transform 1s ease;
            display: block;
        }
        .slideshow-container img.active {
            opacity: 1;
            transform: scale(1.05);
        }

        .message-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ff4d6d;
            border-radius: 15px; 
            padding: 12px 15px;  
            margin: 0 auto 20px auto; 
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.3);
            min-height: auto; 
            max-width: 90%; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #message {
            font-size: 1.1rem; 
            line-height: 1.5;
            font-weight: 300;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
        }
        #message.fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* Music Control */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 77, 109, 0.9);
            border: 2px solid #fff;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.8);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }
        .music-control:hover { transform: scale(1.1); }

        /* Hearts */
        .heart {
            position: absolute;
            width: 20px; height: 20px;
            background: #ff4d6d;
            transform: rotate(-45deg);
            animation: float 6s linear infinite;
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            background: inherit;
            border-radius: 50%;
        }
        .heart::before { top: -10px; left: 0; }
        .heart::after { left: 10px; top: 0; }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(-45deg) scale(0.5); opacity: 1; }
            100% { transform: translateY(-100px) rotate(-45deg) scale(1.5); opacity: 0; }
        }

        /* ===== INTRO SCREEN (3D Heart Only) ===== */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease, visibility 1.5s ease;
        }
        #intro-screen.hide {
            opacity: 0;
            visibility: hidden;
        }
        
        #heart-3d-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .intro-text-3d {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            margin-top: 30px; 
            opacity: 0;
            transition: opacity 2s ease;
        }
        .intro-text-3d.show {
            opacity: 1;
        }
        .intro-text-3d h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 77, 109, 0.8);
            font-weight: 600;
        }

        /* Mobile */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .counter-box { min-width: 60px; padding: 10px; }
            .counter-box span { font-size: 1.5rem; }
            .slideshow-container { width: 180px; height: 180px; }
            #message { font-size: 1rem; }
            .intro-text-3d h2 { font-size: 1.5rem; letter-spacing: 5px; }
            .yes-no-container { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- ========== INTRO SCREEN ========== -->
    <div id="intro-screen">
        <div id="heart-3d-canvas"></div>
        <div class="intro-text-3d" id="intro-text">
            <h2>YOU & ME</h2>
        </div>
    </div>

    <!-- Background Effects -->
    <div id="bg-effects"></div>

    <!-- Hearts -->
    <div id="heart-container"></div>

    <!-- Music Control -->
    <div class="music-control" id="musicControl" title="သီချင်း ဖွင့်/ပိတ်">🔇</div>
    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">

        <!-- ========== PAGE 1: QUIZ (Interactive) ========== -->
        <div class="page active" id="page-quiz">
            <h1 id="quizTitle" style="font-size: 2.2rem; margin-top: 20px;"></h1>
            <p class="subtitle" id="quizSubtitle"></p>

            <div class="yes-no-container" id="yesNoContainer">
                <button class="btn-yes" id="btnYes">Yes</button>
                <button class="btn-no" id="btnNo">No</button>
            </div>
        </div>

        <!-- ========== PAGE 2: FINAL SURPRISE ========== -->
        <div class="page" id="page-final">
            <h1>Happy Anniversary</h1>
            <p class="subtitle">ငါတို့အတူတူ ရှိခဲ့တာ...</p>

            <div class="date-counter">
                <div class="counter-box"><span id="days">0</span><p>Days</p></div>
                <div class="counter-box"><span id="hours">0</span><p>Hours</p></div>
                <div class="counter-box"><span id="minutes">0</span><p>Minutes</p></div>
                <div class="counter-box"><span id="seconds">0</span><p>Seconds</p></div>
            </div>

            <div class="slideshow-container" id="slideshow">
                <img src="myphoto.jpg" alt="Photo 1" class="active">
                <img src="photo1.jpg" alt="Photo 2">
                <img src="photo2.jpg" alt="Photo 3">
                <img src="photo3.jpg" alt="Photo 4">
                <img src="photo4.jpg" alt="Photo 5">
                <img src="photo5.jpg" alt="Photo 6">
            </div>

            <div class="message-box">
                <p id="message">ငါတို့ရဲ့ အချစ်က အမြဲတမ်း ရှင်သန်နေပါစေ 🌹</p>
            </div>
        </div>

    </div>

    <script>
    // ==========================================
    // 1️⃣ INTRO ANIMATION (3D Heart Only)
    // ==========================================
    function initIntroAnimation() {
        const container = document.getElementById('heart-3d-canvas');
        const introText = document.getElementById('intro-text');
        
        if (!container || typeof THREE === 'undefined') return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 35;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const heartShape = new THREE.Shape();
        const x = 0, y = 0;
        heartShape.moveTo(x + 5, y + 5);
        heartShape.bezierCurveTo(x + 5, y + 5, x + 4, y, x, y);
        heartShape.bezierCurveTo(x - 6, y, x - 6, y + 7, x - 6, y + 7);
        heartShape.bezierCurveTo(x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19);
        heartShape.bezierCurveTo(x + 12, y + 15.4, x + 16, y + 11, x + 16, y + 7);
        heartShape.bezierCurveTo(x + 16, y + 7, x + 16, y, x + 10, y);
        heartShape.bezierCurveTo(x + 7, y, x + 5, y + 5, x + 5, y + 5);

        const points = heartShape.getPoints(500); 

        const geometry = new THREE.BufferGeometry();
        const positions = [];
        const targetPositions = []; 
        const colors = [];

        for (let i = 0; i < 4000; i++) {
            const point = points[Math.floor(Math.random() * points.length)];
            const px = (point.x - 5) * (Math.random() * 1.2 + 0.4); 
            const py = (point.y - 9) * (Math.random() * 1.2 + 0.4);
            const pz = (Math.random() - 0.5) * 8; 

            targetPositions.push(px, py, pz);
            
            positions.push(
                (Math.random() - 0.5) * 60, 
                (Math.random() - 0.5) * 60, 
                (Math.random() - 0.5) * 60
            );
            
            const color = new THREE.Color();
            color.setHSL(0.95 + Math.random() * 0.05, 1, 0.5 + Math.random() * 0.3); 
            colors.push(color.r, color.g, color.b);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.25,
            vertexColors: true,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const heartParticles = new THREE.Points(geometry, material);
        heartParticles.rotation.x = Math.PI; 
        scene.add(heartParticles);

        let time = 0;
        let assemblyProgress = 0;
        let particlesVisible = false;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.05;

            if (particlesVisible) {
                if(material.opacity < 0.8) material.opacity += 0.02;

                assemblyProgress += 0.012;
                if (assemblyProgress > 1) assemblyProgress = 1;

                const posAttr = geometry.attributes.position;
                
                for (let i = 0; i < posAttr.count; i++) {
                    const startX = positions[i*3];
                    const startY = positions[i*3+1];
                    const startZ = positions[i*3+2];
                    
                    const endX = targetPositions[i*3];
                    const endY = targetPositions[i*3+1];
                    const endZ = targetPositions[i*3+2];

                    const easeOut = 1 - Math.pow(1 - assemblyProgress, 3);

                    posAttr.setXYZ(
                        i,
                        startX + (endX - startX) * easeOut,
                        startY + (endY - startY) * easeOut,
                        startZ + (endZ - startZ) * easeOut
                    );
                }
                posAttr.needsUpdate = true;
            }

            const scale = 1 + Math.sin(time) * 0.05;
            heartParticles.scale.set(scale, scale, scale);
            
            heartParticles.rotation.y += 0.005;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setTimeout(() => {
            particlesVisible = true;
        }, 500);

        setTimeout(() => {
            introText.classList.add('show');
        }, 3500);

        setTimeout(() => {
            const intro = document.getElementById('intro-screen');
            if (intro) {
                intro.classList.add('hide');
                
                const music = document.getElementById('bgMusic');
                const musicControl = document.getElementById('musicControl');
                if (music && musicControl) {
                    music.play().then(() => {
                        musicControl.innerText = '🔊';
                        musicPlaying = true;
                    }).catch(e => console.log("Browser blocked auto-play"));
                }
            }
        }, 6000);
    }

        // ပထမမေးခွန်းကို ဖျက်လိုက်ပြီဖြစ်လို့ စတင်တဲ့အခါ ဒုတိယမေးခွန်း (စိတ်နှလုံးရဲ့ မေးခွန်း) ကို တိုက်ရိုက်ပြပါမယ်
    let currentStep = 2; 

    const quizTitle = document.getElementById('quizTitle');
    const quizSubtitle = document.getElementById('quizSubtitle');
    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');

    function renderQuiz() {
        // ဒီမှာ မေးခွန်းကို တိုက်ရိုက် သတ်မှတ်လိုက်ပါတယ်
        quizTitle.innerText = "မင်း ငါ့ကို ချစ်လား?";
        quizSubtitle.innerText = "မချစ်ဘူးလို့ ဖြေလို့ မရဘူးနော်... 😉";
        btnYes.innerText = "ချစ်တယ် ❤️";
        btnNo.innerText = "မချစ်ဘူး";
        
        btnNo.style.position = 'relative';
        btnNo.style.left = '0';
        btnNo.style.top = '0';
        btnNo.style.fontSize = '1.2rem';
        btnNo.style.padding = '15px 45px';
    }

    btnYes.addEventListener('click', () => {
        // Yes နှိပ်ရင် နောက်ဆုံး Page ကို သွားမယ်
        showPage('page-final');
        for(let i=0; i<30; i++) setTimeout(createHeart, i*100);
        startFinalPageFeatures();
    });

    // No နှိပ်ရင် ပြေးမယ်
    btnNo.addEventListener('mouseenter', () => {
        moveNoButton();
    });
    
    btnNo.addEventListener('click', (e) => {
        e.preventDefault();
        moveNoButton();
    });

    function moveNoButton() {
        const maxX = window.innerWidth - 250; 
        const maxY = window.innerHeight - 150;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        btnNo.style.position = 'fixed';
        btnNo.style.left = randomX + 'px';
        btnNo.style.top = randomY + 'px';
        
        let currentSize = parseFloat(btnNo.style.fontSize) || 1.2;
        if (currentSize > 0.7) {
            currentSize -= 0.1;
            btnNo.style.fontSize = currentSize + 'rem';
        }
    }
    
    // ဖုန်း သို့မဟုတ် ကွန်ပျူတာနဲ့ နှိပ်လိုက်ရင်
    btnNo.addEventListener('click', (e) => {
        e.preventDefault();
        if (currentStep === 1) {
            // ပထမမေးခွန်း: No နှိပ်တိုင်း ကြီးလာမယ်
            let currentSize = parseFloat(btnNo.style.fontSize) || 1.2;
            let currentPaddingY = parseInt(btnNo.style.paddingTop) || 15;
            let currentPaddingX = parseInt(btnNo.style.paddingLeft) || 45;
            
            if (currentSize < 3) { // အရမ်းကြီးမသွားအောင် ကန့်သတ်
                currentSize += 0.3;
                currentPaddingY += 10;
                currentPaddingX += 20;
                btnNo.style.fontSize = currentSize + 'rem';
                btnNo.style.padding = currentPaddingY + 'px ' + currentPaddingX + 'px';
            }
        } else if (currentStep === 2) {
            // ဒုတိယမေးခွန်း: နှိပ်တိုင်း ပြေးမယ်
            moveNoButton();
        }
    });

    function moveNoButton() {
        // မျက်နှာပြင်တစ်ခုလုံး ဟိုဟိုဒီဒီ ပြေးအောင် တွက်မယ်
        const containerRect = document.querySelector('.container').getBoundingClientRect();
        
        // ခလုတ်က မျက်နှာပြင်ဘောင်ကို မကျော်သွားအောင် အနည်းငယ် ချန်ထားမယ်
        const maxX = window.innerWidth - 250; 
        const maxY = window.innerHeight - 150;

        // ကျပန်း X နဲ့ Y ကို ရွေးမယ်
        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        // position ကို fixed ပြောင်းပြီး ကျပန်းနေရာချမယ်
        btnNo.style.position = 'fixed';
        btnNo.style.left = randomX + 'px';
        btnNo.style.top = randomY + 'px';
        
        // နှိပ်ရခက်အောင် နည်းနည်းလေး သေးသွားအောင် လုပ်မယ်
        let currentSize = parseFloat(btnNo.style.fontSize) || 1.2;
        if (currentSize > 0.7) {
            currentSize -= 0.1;
            btnNo.style.fontSize = currentSize + 'rem';
        }
    }

    // ==========================================
    // 3️⃣ PAGE SWITCHER
    // ==========================================
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0, 0);
    }

    // ==========================================
    // 4️⃣ FINAL PAGE FEATURES
    // ==========================================
    const startDate = new Date(2024, 6, 30, 0, 0, 0);

    function updateCounter() {
        const now = new Date();
        const diff = now - startDate;
        document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById('hours').innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
        document.getElementById('minutes').innerText = Math.floor((diff / (1000 * 60)) % 60);
        document.getElementById('seconds').innerText = Math.floor((diff / 1000) % 60);
    }

    const messages = [
        "မင်းက ငါ့ဘဝရဲ့ အလှဆုံး အပိုင်းအစပဲ ❤️",
        "မင်းရှိတဲ့နေ့တိုင်း ငါပျော်တယ် 🌸",
        "မင်းကို ငါအမြဲတမ်း ချစ်နေမှာပါ 💕",
        "မင်းနဲ့အတူ ရှိချင်တယ် အမြဲတမ်း ✨",
        "မင်းရဲ့ အပြုံးက ငါ့ရဲ့ အားဆေးပဲ 😊",
        "ငါတို့အတူတူ ဖြတ်သန်းခဲ့တဲ့ နေ့ရက်တွေ အမှတ်တရပါ 💖",
        "မင်းက ငါ့ရဲ့ ကမ္ဘာလေးပဲ 🌍",
        "မင်းအတွက် ငါ အမြဲရှိနေမယ် 🤗",
        "မင်းကို ချစ်တာ တစ်နေ့ထက်တစ်နေ့ ပိုလာတယ် 💘",
        "ငါတို့ရဲ့ အချစ်က အမြဲတမ်း ရှင်သန်နေပါစေ 🌹"
    ];
    let messageIndex = 0;
    
    function startFinalPageFeatures() {
        setInterval(updateCounter, 1000);
        updateCounter();

        setInterval(() => {
            const messageEl = document.getElementById('message');
            if(messageEl) {
                messageEl.classList.add('fade-out');
                setTimeout(() => {
                    messageIndex = (messageIndex + 1) % messages.length;
                    messageEl.innerText = messages[messageIndex];
                    messageEl.classList.remove('fade-out');
                }, 500);
            }
        }, 4000);
    }

    const slideshowImages = document.querySelectorAll('#slideshow img');
    let slideIndex = 0;
    if (slideshowImages.length > 0) {
        setInterval(() => {
            slideshowImages[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + 1) % slideshowImages.length;
            slideshowImages[slideIndex].classList.add('active');
        }, 3500);
    }

    // ==========================================
    // 5️⃣ MUSIC CONTROL & STARTUP
    // ==========================================
    const music = document.getElementById('bgMusic');
    const musicControl = document.getElementById('musicControl');
    let musicPlaying = false;

    window.addEventListener('load', () => {
        initIntroAnimation();
        renderQuiz();
    });

    musicControl.addEventListener('click', () => {
        if (musicPlaying) {
            music.pause();
            musicControl.innerText = '🔇';
            musicPlaying = false;
        } else {
            music.play().catch(e => console.log('Music play failed:', e));
            musicControl.innerText = '🔊';
            musicPlaying = true;
        }
    });

    // ==========================================
    // 6️⃣ BACKGROUND EFFECTS (Stars & Petals)
    // ==========================================
    const bgEffects = document.getElementById('bg-effects');

    for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.animationDelay = Math.random() * 2 + 's';
        bgEffects.appendChild(star);
    }

    const petals = ['🌸', '🌺', '🌹', '💐', '🌷'];
    setInterval(() => {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.innerText = petals[Math.floor(Math.random() * petals.length)];
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.animationDuration = (Math.random() * 5 + 8) + 's';
        petal.style.fontSize = (Math.random() * 1 + 1) + 'rem';
        bgEffects.appendChild(petal);
        setTimeout(() => petal.remove(), 13000);
    }, 1500);

    // ==========================================
    // 7️⃣ FLOATING HEARTS ANIMATION
    // ==========================================
    const heartContainer = document.getElementById('heart-container');

    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.style.left = Math.random() * 100 + 'vw';
        const size = Math.random() * 20 + 10;
        heart.style.width = size + 'px';
        heart.style.height = size + 'px';
        const colors = ['#ff4d6d', '#ff8fa3', '#ffb3c1', '#ff006e'];
        heart.style.background = colors[Math.floor(Math.random() * colors.length)];
        heart.style.animationDuration = Math.random() * 2 + 4 + 's';
        heartContainer.appendChild(heart);
        setTimeout(() => heart.remove(), 8000);
    }
    setInterval(createHeart, 800);
    </script>
</body>
</html>
